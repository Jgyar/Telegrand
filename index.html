<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegrand</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
:root { --bg:#fff; --bg2:#f4f4f5; --bg3:#e9e9eb; --text:#000; --text2:#707579; --accent:#3390ec; --msg-out:#eeffde; --msg-in:#fff; --border:#e4e4e5; --font-size:15px; }
[data-theme="dark"] { --bg:#212121; --bg2:#181818; --bg3:#2b2b2b; --text:#fff; --text2:#aaa; --accent:#5288c1; --msg-out:#2b5278; --msg-in:#182533; --border:#303030; }
body { background: var(--bg2); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; }

/* AUTH */
#authScreen { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; background: linear-gradient(135deg, #3390ec, #6bb2f5); padding: 20px; }
.auth-box { background: var(--bg); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.auth-box h1 { text-align: center; margin-bottom: 8px; font-size: 26px; }
.auth-box .logo { text-align: center; font-size: 54px; margin-bottom: 10px; }
.auth-box p.sub { text-align: center; color: var(--text2); margin-bottom: 24px; font-size: 14px; }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg3); border-radius: 10px; padding: 4px; }
.auth-tabs button { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text2); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.auth-tabs button.active { background: var(--accent); color: #fff; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg2); color: var(--text); font-size: 15px; outline: none; }
.field input:focus { border-color: var(--accent); }
.btn-main { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 8px; }
.btn-main:disabled { opacity: .5; }
.err { color: #e53935; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }

/* APP */
#app { display: none; height: 100vh; height: 100dvh; }
.layout { display: flex; height: 100vh; height: 100dvh; }
.sidebar { width: 340px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; position: relative; }
.online-dot { position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: #4caf50; border: 2px solid var(--bg); }
.sidebar-header .search { flex: 1; padding: 9px 14px; border: none; border-radius: 20px; background: var(--bg3); color: var(--text); outline: none; font-size: 14px; }
.sidebar-tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); }
.sidebar-tabs button { flex: 1; padding: 12px 4px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-weight: 600; font-size: 12px; border-bottom: 2px solid transparent; }
.sidebar-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.list { flex: 1; overflow-y: auto; }
.item { display: flex; gap: 12px; padding: 10px 16px; cursor: pointer; align-items: center; }
.item:hover { background: var(--bg3); }
.item.active { background: var(--accent); color: #fff; }
.item.active .sub, .item.active .time { color: rgba(255,255,255,.8); }
.body { flex: 1; min-width: 0; }
.name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.time { font-size: 12px; color: var(--text2); }
.empty-list { padding: 30px 20px; text-align: center; color: var(--text2); font-size: 14px; line-height: 1.5; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
.chat-header { padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); background: var(--bg); }
.chat-header .info { flex: 1; min-width: 0; }
.chat-header h3 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header p { font-size: 12px; color: var(--accent); }
.icon-btn { background: transparent; border: none; cursor: pointer; font-size: 20px; padding: 8px; border-radius: 50%; color: var(--text2); min-width: 40px; min-height: 40px; }
.messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg3); background-image: radial-gradient(circle, rgba(128,128,128,.1) 1px, transparent 1px); background-size: 24px 24px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: var(--font-size); position: relative; }
.msg.out { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
.msg.in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; }
.msg .author { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.msg .text { line-height: 1.35; }
.msg .meta { font-size: 11px; color: var(--text2); text-align: right; margin-top: 3px; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.msg .del { cursor: pointer; opacity: .6; padding: 2px 4px; }
.msg-img { max-width: 260px; max-height: 320px; border-radius: 8px; margin: 4px 0; cursor: pointer; display: block; }
.msg-file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(128,128,128,.15); border-radius: 8px; margin: 4px 0; text-decoration: none; color: inherit; }
.msg-sticker { font-size: 72px; line-height: 1; padding: 4px; user-select: none; }
.msg-voice { display: flex; align-items: center; gap: 8px; padding: 4px 0; min-width: 180px; }
.voice-play { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 14px; }
.voice-wave { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; }
.voice-wave span { width: 3px; background: var(--accent); border-radius: 2px; opacity: .5; }
.voice-wave span.on { opacity: 1; }

.reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.reaction { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; background: rgba(128,128,128,.2); cursor: pointer; font-size: 13px; }
.reaction.mine { background: var(--accent); color: #fff; }
.reaction-add { padding: 3px 8px; border-radius: 12px; background: transparent; border: 1px dashed var(--border); cursor: pointer; font-size: 13px; color: var(--text2); }

.input-bar { padding: 8px 10px 10px; display: flex; gap: 6px; align-items: flex-end; border-top: 1px solid var(--border); background: var(--bg); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.input-bar textarea { flex: 1; padding: 10px 14px; border: none; border-radius: 20px; background: var(--bg3); color: var(--text); font-size: var(--font-size); resize: none; max-height: 120px; outline: none; font-family: inherit; min-width: 0; }
.send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.attach-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent; color: var(--text2); font-size: 20px; cursor: pointer; flex-shrink: 0; }
.attach-btn.recording { color: #e53935; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .4; } }

.empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--text2); text-align: center; padding: 20px; }
.empty-chat .big { font-size: 70px; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: var(--bg); border-radius: 16px; padding: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
.modal h2 { margin-bottom: 16px; font-size: 20px; }
.modal .close { position: absolute; top: 12px; right: 12px; font-size: 26px; cursor: pointer; color: var(--text2); border: none; background: none; width: 40px; height: 40px; }
.sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 300px; overflow-y: auto; }
.sticker-grid span { font-size: 36px; cursor: pointer; padding: 6px; text-align: center; border-radius: 8px; }

.attach-panel { display: flex; gap: 8px; padding: 8px 12px; background: var(--bg); border-top: 1px solid var(--border); flex-wrap: wrap; }
.attach-panel button { padding: 10px 16px; border: none; border-radius: 10px; background: var(--bg3); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 500; }

.settings-section { background: var(--bg2); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.settings-title { padding: 8px 16px; font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.settings-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
.settings-item:last-child { border-bottom: none; }
.settings-item:active { background: var(--bg3); }
.settings-item .si-ico { font-size: 22px; width: 32px; text-align: center; }
.settings-item .si-body { flex: 1; }
.settings-item .si-title { font-size: 15px; font-weight: 500; }
.settings-item .si-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.settings-item .si-arrow { color: var(--text2); font-size: 18px; }
.toggle { width: 46px; height: 28px; background: var(--bg3); border-radius: 14px; position: relative; cursor: pointer; transition: .2s; flex-shrink: 0; }
.toggle.on { background: var(--accent); }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on::after { left: 21px; }

@media (max-width: 700px) {
  .sidebar { width: 100%; position: absolute; z-index: 10; height: 100vh; height: 100dvh; }
  .sidebar.hidden { display: none; }
  .main { width: 100%; }
  .msg { max-width: 85%; }
}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <div class="logo">✈️</div>
    <h1>Telegrand</h1>
    <p class="sub">Мессенджер в реальном времени</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">Вход</button>
      <button id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
    </div>
    <div id="regFields" style="display:none">
      <div class="field"><label>Логин</label><input id="rUser" placeholder="username" maxlength="20"></div>
      <div class="field"><label>Отображаемое имя</label><input id="rName" placeholder="Ваше имя"></div>
    </div>
    <div class="field"><label>Email</label><input id="aEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Пароль (от 6 символов)</label><input id="aPass" type="password" placeholder="••••••"></div>
    <button class="btn-main" id="authBtn" onclick="doAuth()">Войти</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="myAvatar" onclick="openProfile()"></div>
        <input class="search" id="searchInput" placeholder="Поиск..." oninput="renderList()">
      </div>
      <div class="sidebar-tabs">
        <button id="tabChats" class="active" onclick="switchSide('chats')">💬 Чаты</button>
        <button id="tabUsers" onclick="switchSide('users')">👥 Люди</button>
        <button onclick="openProfile()">⚙️</button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFile(this, 'image')">
<input type="file" id="docInput" style="display:none" onchange="handleFile(this, 'file')">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://fxzubucqsfivmkoyiofi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4enVidWNxc2Zpdm1rb3lpb2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODU3MDEsImV4cCI6MjEwNzU2MTcwMX0.4Vu_p9U5Z_tENDxvRjlaGRlKGjqSwJacC909J8playU';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, currentProfile = null, profiles = {}, chats = [], activeChat = null, chatMessages = [], lastMessages = {}, sideTab = 'chats', channel = null;

const STICKERS = ['😀','😂','🥰','😎','🤔','😴','🤯','🥳','😭','🤩','🐶','🐱','🦊','🐼','🦁','🐸','🐵','🦄','🐧','🦋','🍕','🍔','🍟','🍩','🍦','🍎','🍓','🎂','☕','🍺','⚽','🏀','🎮','🎲','🎯','🎨','🎭','🎸','🚀','✈️','❤️','🔥','⭐','✨','💯','👍','👏','🙏','💪','🎉'];
const REACTIONS = ['👍','❤️','😂','🔥','😢','😮','🎉','👏','🤔','💯'];
const EMOJI_BAR = ['😀','😂','😍','🔥','👍','❤️','🎉','😎','🤔','😢','🙏','✨'];

// ========== AUTH ==========
let authMode = 'login';
window.switchAuth = m => {
  authMode = m;
  document.getElementById('tabLogin').classList.toggle('active', m==='login');
  document.getElementById('tabReg').classList.toggle('active', m==='reg');
  document.getElementById('regFields').style.display = m==='reg' ? 'block' : 'none';
  document.getElementById('authBtn').textContent = m==='reg' ? 'Создать аккаунт' : 'Войти';
  document.getElementById('authErr').textContent = '';
};

window.doAuth = async () => {
  const email = document.getElementById('aEmail').value.trim();
  const pass = document.getElementById('aPass').value;
  const err = document.getElementById('authErr');
  const btn = document.getElementById('authBtn');
  err.style.color = '#e53935';
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Заполните email и пароль'; return; }
  if (pass.length < 6) { err.textContent = 'Пароль от 6 символов'; return; }
  btn.disabled = true; btn.textContent = 'Загрузка...';
  try {
    if (authMode === 'reg') {
      const username = document.getElementById('rUser').value.trim().toLowerCase();
      const name = document.getElementById('rName').value.trim() || username;
      if (!username || username.length < 3) throw new Error('Логин от 3 символов');
      const { data, error } = await supabase.auth.signUp({ email, password: pass, options: { data: { username, name } } });
      if (error) throw error;
      if (!data.session) {
        err.style.color = '#4caf50';
        err.textContent = 'Проверьте email и перейдите по ссылке';
      }
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    }
  } catch(e) {
    err.textContent = translateAuthError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'reg' ? 'Создать аккаунт' : 'Войти';
  }
};

function translateAuthError(msg) {
  if (msg.includes('Invalid login')) return 'Неверный email или пароль';
  if (msg.includes('already registered') || msg.includes('already been registered')) return 'Email уже зарегистрирован';
  if (msg.includes('Email not confirmed')) return 'Подтвердите email по ссылке из письма';
  if (msg.includes('rate limit')) return 'Слишком много попыток, подожди минуту';
  return msg;
}

window.logout = async () => {
  if (!confirm('Выйти?')) return;
  if (currentUser) await supabase.from('profiles').update({ online: false, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  await supabase.auth.signOut();
  location.reload();
};

supabase.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    currentUser = session.user;
    await loadProfile();
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await initApp();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

async function loadProfile() {
  const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
  if (data) currentProfile = data;
  else {
    const meta = currentUser.user_metadata || {};
    const { data: created } = await supabase.from('profiles').upsert({
      id: currentUser.id,
      username: meta.username || currentUser.email.split('@')[0],
      name: meta.name || meta.username || 'Пользователь',
      online: true, last_seen: new Date().toISOString()
    }).select().single();
    currentProfile = created;
  }
  await supabase.from('profiles').update({ online: true, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
}

// ========== APP ==========
async function initApp() {
  const initial = currentProfile.avatar_emoji || currentProfile.name[0].toUpperCase();
  const av = document.getElementById('myAvatar');
  av.textContent = initial;
  av.style.background = currentProfile.color || '#3390ec';
  await loadAllProfiles();
  await loadMyChats();
  subscribeRealtime();
  renderList();
  window.addEventListener('beforeunload', () => {
    if (currentUser) supabase.from('profiles').update({ online: false, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  });
}

async function loadAllProfiles() {
  const { data } = await supabase.from('profiles').select('*');
  profiles = {};
  (data || []).forEach(p => profiles[p.id] = p);
}

async function loadMyChats() {
  const { data } = await supabase.from('chats').select('*').contains('members', [currentUser.id]);
  chats = data || [];
  await loadLastMessages();
}

async function loadLastMessages() {
  lastMessages = {};
  for (const chat of chats) {
    const { data } = await supabase.from('messages').select('*').eq('chat_id', chat.id).order('created_at', { ascending: false }).limit(1);
    if (data && data[0]) lastMessages[chat.id] = data[0];
  }
}

function subscribeRealtime() {
  if (channel) supabase.removeChannel(channel);
  channel = supabase.channel('rt')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const msg = payload.new;
      if (activeChat && msg.chat_id === activeChat.id) {
        if (!chatMessages.find(m => m.id === msg.id)) { chatMessages.push(msg); renderMessages(); scrollBottom(); }
      }
      if (chats.find(c => c.id === msg.chat_id)) { lastMessages[msg.chat_id] = msg; renderList(); }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
      const msg = payload.new;
      if (activeChat && msg.chat_id === activeChat.id) {
        const idx = chatMessages.findIndex(m => m.id === msg.id);
        if (idx >= 0) { chatMessages[idx] = msg; renderMessages(); }
      }
      if (lastMessages[msg.chat_id]?.id === msg.id) { lastMessages[msg.chat_id] = msg; renderList(); }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      if (activeChat && payload.old.chat_id === activeChat.id) {
        chatMessages = chatMessages.filter(m => m.id !== payload.old.id);
        renderMessages();
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => { await loadAllProfiles(); renderList(); if (activeChat) renderMain(); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, async () => { await loadMyChats(); renderList(); })
    .subscribe();
}

window.switchSide = tab => {
  sideTab = tab;
  document.getElementById('tabChats').classList.toggle('active', tab==='chats');
  document.getElementById('tabUsers').classList.toggle('active', tab==='users');
  renderList();
};

function renderList() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const el = document.getElementById('list');
  if (sideTab === 'chats') {
    if (!chats.length) { el.innerHTML = '<div class="empty-list">Нет чатов.<br>Открой <b>👥 Люди</b> чтобы начать общение</div>'; return; }
    const sorted = [...chats].sort((a,b) => {
      const ta = lastMessages[a.id]?.created_at || a.created_at;
      const tb = lastMessages[b.id]?.created_at || b.created_at;
      return new Date(tb) - new Date(ta);
    });
    el.innerHTML = sorted.map(c => {
      const last = lastMessages[c.id];
      const time = last ? new Date(last.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}) : '';
      const active = activeChat && activeChat.id === c.id ? 'active' : '';
      let name, initial, color, isOnline = false;
      if (c.type === 'direct') {
        const otherId = c.members.find(m => m !== currentUser.id);
        const other = profiles[otherId] || {};
        name = other.name || 'Пользователь';
        initial = other.avatar_emoji || name[0]?.toUpperCase() || '?';
        color = other.color || '#3390ec';
        isOnline = !!other.online;
      } else { name = c.name || 'Группа'; initial = '👥'; color = '#7bc862'; }
      if (q && !name.toLowerCase().includes(q)) return '';
      const preview = last ? (last.user_id === currentUser.id ? 'Вы: ' : '') + previewText(last) : 'Нет сообщений';
      return `<div class="item ${active}" onclick="openChat(${c.id})">
        <div class="avatar" style="background:${color}">${initial}${isOnline?'<div class="online-dot"></div>':''}</div>
        <div class="body"><div class="name">${escapeHtml(name)}</div><div class="sub">${escapeHtml(preview).slice(0,50)}</div></div>
        <div class="time">${time}</div>
      </div>`;
    }).join('');
  } else {
    const others = Object.values(profiles).filter(p => p.id !== currentUser.id);
    if (!others.length) { el.innerHTML = '<div class="empty-list">Пока никого нет.<br>Пусть друзья зарегистрируются!</div>'; return; }
    const filtered = others.filter(p => !q || (p.name||'').toLowerCase().includes(q) || (p.username||'').toLowerCase().includes(q));
    el.innerHTML = filtered.map(p => `
      <div class="item" onclick="startDirect('${p.id}')">
        <div class="avatar" style="background:${p.color||'#3390ec'}">${p.avatar_emoji || (p.name||'?')[0].toUpperCase()}${p.online?'<div class="online-dot"></div>':''}</div>
        <div class="body"><div class="name">${escapeHtml(p.name || p.username)}</div><div class="sub">@${escapeHtml(p.username)}${p.online ? ' · в сети' : ''}</div></div>
      </div>
    `).join('');
  }
}

function previewText(m) {
  if (m.type === 'voice') return '🎤 Голосовое';
  if (m.type === 'image') return '🖼 Фото';
  if (m.type === 'file') return '📎 ' + (m.file_name || 'Файл');
  if (m.type === 'sticker') return m.text + ' Стикер';
  return m.text || '';
}

window.startDirect = async (otherId) => {
  const existing = chats.find(c => c.type === 'direct' && c.members.length === 2 && c.members.includes(otherId) && c.members.includes(currentUser.id));
  if (existing) { openChat(existing.id); return; }
  const { data, error } = await supabase.from('chats').insert({ type: 'direct', members: [currentUser.id, otherId] }).select().single();
  if (error) { alert('Ошибка: ' + error.message); return; }
  chats.push(data);
  openChat(data.id);
};

window.openChat = async (chatId) => {
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;
  activeChat = chat;
  document.getElementById('sidebar').classList.add('hidden');
  const { data } = await supabase.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
  chatMessages = data || [];
  renderMain();
  renderList();
};

window.backToList = () => {
  document.getElementById('sidebar').classList.remove('hidden');
  activeChat = null;
  renderList();
};

function renderMain() {
  const main = document.getElementById('mainArea');
  const chat = activeChat;
  if (!chat) { main.innerHTML = '<div class="empty-chat"><div class="big">💬</div><p>Выбери чат слева</p></div>'; return; }
  let name, initial, color, sub;
  if (chat.type === 'direct') {
    const otherId = chat.members.find(m => m !== currentUser.id);
    const other = profiles[otherId] || {};
    name = other.name || 'Пользователь';
    initial = other.avatar_emoji || name[0]?.toUpperCase() || '?';
    color = other.color || '#3390ec';
    sub = other.online ? 'в сети' : (other.last_seen ? 'был(а) ' + new Date(other.last_seen).toLocaleString('ru',{hour:'2-digit',minute:'2-digit'}) : 'не в сети');
  } else { name = chat.name || 'Группа'; initial = '👥'; color = '#7bc862'; sub = chat.members.length + ' участников'; }

  main.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn" onclick="backToList()">←</button>
      <div class="avatar" style="background:${color}">${initial}</div>
      <div class="info"><h3>${escapeHtml(name)}</h3><p>${escapeHtml(sub)}</p></div>
    </div>
    <div class="messages" id="messages">${renderMessagesHTML()}</div>
    <div class="input-bar">
      <button class="attach-btn" onclick="openAttachPanel()">📎</button>
      <textarea id="msgInput" rows="1" placeholder="Сообщение..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  `;
  scrollBottom();
}

function renderMessagesHTML() {
  if (!chatMessages.length) return '<div class="empty-chat"><div class="big">💬</div><p>Начни переписку</p></div>';
  return chatMessages.map(m => {
    const out = m.user_id === currentUser.id;
    const time = new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    const author = !out && activeChat.type === 'group' ? `<div class="author">${escapeHtml(profiles[m.user_id]?.name || m.username || '?')}</div>` : '';
    let content = '';
    if (m.type === 'sticker') content = `<div class="msg-sticker">${m.text}</div>`;
    else if (m.type === 'image') content = `<img class="msg-img" src="${m.data}" onclick="viewImage('${m.id}')" alt="фото">`;
    else if (m.type === 'file') content = `<a class="msg-file" href="${m.data}" download="${escapeHtml(m.file_name||'file')}"><div style="font-size:28px">📎</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${escapeHtml(m.file_name||'Файл')}</div><div style="font-size:12px;color:var(--text2)">${formatSize(m.file_size||0)}</div></div></a>`;
    else if (m.type === 'voice') content = `<div class="msg-voice"><button class="voice-play" onclick="playVoice('${m.id}')" id="play_${m.id}">▶</button><div class="voice-wave" id="wave_${m.id}">${Array(24).fill(0).map(()=>`<span style="height:${6+Math.random()*18}px"></span>`).join('')}</div><div style="font-size:12px;color:var(--text2)">${m.duration ? Math.floor(m.duration/60)+':'+String(m.duration%60).padStart(2,'0') : '0:00'}</div></div>`;
    else content = `<div class="text">${escapeHtml(m.text||'').replace(/\n/g,'<br>')}</div>`;

    const reacts = m.reactions || {};
    const reactsHtml = renderReactionsHTML(m, reacts);
    const actions = out ? `<span class="del" onclick="event.stopPropagation();deleteMsg(${m.id})">🗑</span>` : '';
    return `<div class="msg ${out?'out':'in'}">${author}${content}${reactsHtml}<div class="meta">${time}${m.edited?' (изм.)':''}${actions}</div></div>`;
  }).join('');
}

function renderReactionsHTML(m, reacts) {
  const keys = Object.keys(reacts);
  if (!keys.length) return `<div class="reactions"><button class="reaction-add" onclick="openReactionPicker(event,${m.id})">+ 😊</button></div>`;
  return `<div class="reactions">${keys.map(k => {
    const arr = reacts[k] || [];
    const mine = arr.includes(currentUser.id);
    return `<div class="reaction ${mine?'mine':''}" onclick="toggleReaction(${m.id},'${k}')"><span>${k}</span><span>${arr.length}</span></div>`;
  }).join('')}<button class="reaction-add" onclick="openReactionPicker(event,${m.id})">+</button></div>`;
}

function renderMessages() {
  const el = document.getElementById('messages');
  if (el) el.innerHTML = renderMessagesHTML();
}

function scrollBottom() {
  const box = document.getElementById('messages');
  if (box) box.scrollTop = box.scrollHeight;
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

window.sendMessage = async () => {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !activeChat) return;
  inp.value = '';
  const { error } = await supabase.from('messages').insert({
    chat_id: activeChat.id, user_id: currentUser.id,
    username: currentProfile.username, text, type: 'text'
  });
  if (error) alert('Ошибка: ' + error.message);
};

window.deleteMsg = async (id) => {
  if (!confirm('Удалить?')) return;
  await supabase.from('messages').delete().eq('id', id);
};

window.toggleReaction = async (msgId, emoji) => {
  const m = chatMessages.find(x => x.id === msgId);
  if (!m) return;
  const reacts = { ...(m.reactions || {}) };
  const arr = reacts[emoji] ? [...reacts[emoji]] : [];
  const idx = arr.indexOf(currentUser.id);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(currentUser.id);
  if (arr.length) reacts[emoji] = arr; else delete reacts[emoji];
  await supabase.from('messages').update({ reactions: reacts }).eq('id', msgId);
  m.reactions = reacts;
  renderMessages();
};

window.openReactionPicker = (e, msgId) => {
  e.stopPropagation();
  closePopup();
  const picker = document.createElement('div');
  picker.className = 'modal-bg show';
  picker.id = 'reactionPicker';
  picker.style.background = 'transparent';
  picker.innerHTML = `<div class="modal" style="max-width:280px;padding:12px"><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${REACTIONS.map(r=>`<span style="font-size:26px;cursor:pointer;padding:6px" onclick="toggleReaction(${msgId},'${r}');closePopup()">${r}</span>`).join('')}</div></div>`;
  picker.onclick = ev => { if (ev.target === picker) closePopup(); };
  document.body.appendChild(picker);
};

window.closePopup = () => { ['reactionPicker','stickerPanel','attachSlot'].forEach(id => { const e = document.getElementById(id); if (e) e.remove(); }); };

window.openAttachPanel = () => {
  if (document.getElementById('attachSlot')) { closePopup(); return; }
  closePopup();
  const slot = document.createElement('div');
  slot.id = 'attachSlot';
  slot.className = 'attach-panel';
  slot.style.position = 'fixed';
  slot.style.bottom = '70px'; slot.style.left = '10px'; slot.style.right = '10px';
  slot.style.borderRadius = '12px'; slot.style.boxShadow = '0 4px 20px rgba(0,0,0,.3)';
  slot.innerHTML = `
    <button onclick="document.getElementById('fileInput').click();closePopup()">🖼 Фото</button>
    <button onclick="document.getElementById('docInput').click();closePopup()">📎 Файл</button>
    <button onclick="closePopup();openStickers()">🎨 Стикер</button>`;
  document.body.appendChild(slot);
};

window.openStickers = () => {
  closePopup();
  const p = document.createElement('div');
  p.id = 'stickerPanel';
  p.className = 'modal-bg show';
  p.innerHTML = `<div class="modal"><button class="close" onclick="closePopup()">×</button><h2>Стикеры</h2><div class="sticker-grid">${STICKERS.map(s=>`<span onclick="sendSticker('${s}')">${s}</span>`).join('')}</div></div>`;
  p.onclick = ev => { if (ev.target === p) closePopup(); };
  document.body.appendChild(p);
};

window.sendSticker = async (emoji) => {
  closePopup();
  await supabase.from('messages').insert({ chat_id: activeChat.id, user_id: currentUser.id, username: currentProfile.username, type: 'sticker', text: emoji });
};

window.handleFile = async (input, kind) => {
  const file = input.files[0];
  if (!file) return;
  const maxSize = 500 * 1024; // 500 КБ на медиа (Supabase free-tier позволяет больше, но для теста)
  if (file.size > maxSize) { alert('Файл слишком большой (макс 500 КБ)'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async ev => {
    const data = ev.target.result;
    if (kind === 'image') await supabase.from('messages').insert({ chat_id: activeChat.id, user_id: currentUser.id, username: currentProfile.username, type: 'image', data });
    else await supabase.from('messages').insert({ chat_id: activeChat.id, user_id: currentUser.id, username: currentProfile.username, type: 'file', data, file_name: file.name, file_size: file.size });
  };
  reader.readAsDataURL(file);
  input.value = '';
};

window.formatSize = b => b < 1024 ? b + ' Б' : b < 1048576 ? (b/1024).toFixed(1) + ' КБ' : (b/1048576).toFixed(2) + ' МБ';
window.escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.viewImage = id => {
  const m = chatMessages.find(x => x.id === id);
  if (!m) return;
  const p = document.createElement('div');
  p.className = 'modal-bg show';
  p.id = 'reactionPicker';
  p.innerHTML = `<img src="${m.data}" style="max-width:95vw;max-height:90vh;border-radius:8px" onclick="closePopup()">`;
  p.onclick = closePopup;
  document.body.appendChild(p);
};

window.playVoice = id => {
  const m = chatMessages.find(x => x.id === id);
  if (!m) return;
  const audio = new Audio(m.data);
  audio.play();
  const btn = document.getElementById('play_' + id);
  if (btn) btn.textContent = '⏸';
  audio.onended = () => { if (btn) btn.textContent = '▶'; };
};

window.openProfile = () => {
  const modal = document.getElementById('modalBox');
  modal.innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h2>⚙️ Профиль</h2>
    <div class="settings-section">
      <div class="settings-item"><div class="si-ico">👤</div><div class="si-body"><div class="si-title">Имя</div><div class="si-desc">${escapeHtml(currentProfile.name)}</div></div></div>
      <div class="settings-item"><div class="si-ico">@</div><div class="si-body"><div class="si-title">Логин</div><div class="si-desc">@${escapeHtml(currentProfile.username)}</div></div></div>
      <div class="settings-item"><div class="si-ico">📧</div><div class="si-body"><div class="si-title">Email</div><div class="si-desc">${escapeHtml(currentUser.email)}</div></div></div>
    </div>
    <div class="settings-section">
      <div class="settings-item" onclick="toggleTheme()">
        <div class="si-ico">🌓</div>
        <div class="si-body"><div class="si-title">Тёмная тема</div><div class="si-desc">Сейчас: ${document.documentElement.getAttribute('data-theme') === 'dark' ? 'включена' : 'выключена'}</div></div>
      </div>
    </div>
    <button class="btn-main" style="background:#e53935;margin-top:16px" onclick="logout()">Выйти</button>
  `;
  document.getElementById('modalBg').classList.add('show');
};

window.toggleTheme = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('tg_theme', next);
  closeModal();
};

window.closeModal = () => { document.getElementById('modalBg').classList.remove('show'); closePopup(); };

const savedTheme = localStorage.getItem('tg_theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

</script>
</body>
